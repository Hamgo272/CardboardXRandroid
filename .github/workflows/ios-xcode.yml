# Builds the unsigned .ipa from a Unity export made on Windows (no Unity license in CI):
#   1. On Windows: Unity exports Builds/iOS (StereoBuilder.BuildIos); it's packed as
#      xcode-export.tgz and uploaded to the "xcode-export" release.
#   2. This workflow, started by hand or by `gh workflow run ios-xcode.yml`, compiles it on a
#      macOS runner without signing and attaches CardboardXR-iPhone.ipa to "latest-iphone".
# Sideloadly then signs it with a free Apple ID and installs it.

name: iPhone build (from Windows export)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label (Apple-chip runners are sometimes short on capacity)
        default: macos-15-intel

jobs:
  xcode-build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download the Unity export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download xcode-export --repo "$GITHUB_REPOSITORY" --pattern 'xcode-export.tgz*'
          cat xcode-export.tgz* > export.tgz
          mkdir -p Builds
          tar -xzf export.tgz -C Builds
          ls Builds/iOS | head

      - name: Build without signing
        working-directory: Builds/iOS
        run: |
          set -o pipefail
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build > "$RUNNER_TEMP/xcode.log" 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/xcode.log" | head -40
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcode.log"

      - name: Package .ipa
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CardboardXR-iPhone.ipa Payload
          ls -lh CardboardXR-iPhone.ipa

      - name: Publish to the latest-iphone release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-iphone
          name: Latest iPhone build
          prerelease: true
          body: |
            Unsigned build ${{ github.run_number }} from a Windows Unity export.
            Install with Sideloadly (free Apple ID) — see PLAN_HE.md.
          files: CardboardXR-iPhone.ipa

      - name: Keep the Xcode log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-log
          path: ${{ runner.temp }}/xcode.log
